name: add video

# Publishes an episode on the website from the Actions tab:
# Actions → "add video" → Run workflow → slug + YouTube id (or URL).
# It opens a pull request; nothing reaches main (or dexty.live) until David merges it.
on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Episode slug from website/data/episodes.json (e.g. time-compressed)"
        required: true
        type: string
      youtube_id:
        description: "YouTube video id or URL"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  add-video:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update episodes.json and rebuild pages
        env:
          SLUG: ${{ inputs.slug }}
          YOUTUBE_ID: ${{ inputs.youtube_id }}
        run: node tools/add-video.mjs "$SLUG" "$YOUTUBE_ID"
      - name: Tests
        run: node --test tests/*.test.mjs
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ inputs.slug }}
        run: |
          case "$SLUG" in *[!a-z0-9-]*|"") echo "invalid slug"; exit 1;; esac
          branch="video/${SLUG}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add data/episodes.json index.html 404.html sitemap.xml collection episodes subject
          git commit -m "feat: publish ${SLUG} on the website"
          git push -u origin "$branch"
          gh pr create --title "feat: publish ${SLUG} on the website" --body "Generated by the add-video workflow. Merge to put the video on dexty.live." --base main --head "$branch"
