<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Did You Know That? · The Road of Wonders</title>
    <meta name="description" content="Short stories with Dexter: discover something surprising, read or watch the episode, and keep a card of what you learned. For kids and adults, in 7 languages." />
    <meta name="theme-color" content="#0b0726" />
    <link rel="icon" href="assets/logo.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Did You Know" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/world.css" />
    <link rel="stylesheet" href="css/book.css" />
    <link rel="stylesheet" href="css/card.css" />
    <link rel="stylesheet" href="css/panels.css" />
  </head>
  <body>
    <header class="hud">
      <a class="hud-brand" href="https://www.youtube.com/@Did-You-Know-that-2026" target="_blank" rel="noopener">
        <img src="assets/logo.png" alt="" />
        <span><b>Did You Know That?</b><small data-i18n="start.sub">The Road of Wonders</small></span>
      </a>
      <div class="hud-actions">
        <span id="hud-coins" class="hud-chip hud-coins" data-i18n-aria="coins.title" aria-label="Coins">🪙 0</span>
        <button id="hud-inventory" class="hud-chip" data-i18n-aria="hud.inventory" aria-label="Open inventory">🎒 <span id="hud-cards">0/0</span></button>
        <button id="hud-lang" class="hud-icon" aria-label="Language">EN</button>
        <button id="hud-settings" class="hud-icon" data-i18n-aria="settings.title" aria-label="Settings">⚙️</button>
      </div>
    </header>

    <main id="world" class="world-wrap" aria-label="Journey map"></main>
    <div id="kids-bar-host" class="kids-bar-host"></div>
    <section id="adult-home" class="adult-home-layer" aria-label="Today's discovery" hidden></section>

    <nav class="walk-controls" aria-label="Move Dexter">
      <button id="walk-left" class="walk-btn" data-i18n-aria="walk.left" aria-label="Walk left">◀</button>
      <button id="walk-enter" class="walk-btn enter" data-i18n-aria="walk.enter" aria-label="Go in">⬆</button>
      <button id="walk-right" class="walk-btn" data-i18n-aria="walk.right" aria-label="Walk right">▶</button>
    </nav>

    <section id="book-layer" class="layer book-layer" hidden aria-label="Story book">
      <div class="book-toolbar">
        <span id="book-sparks" class="pill">✦ 0/0</span>
        <div class="book-tools">
          <button id="book-text" class="hud-btn tool-btn" aria-pressed="false" data-i18n-aria="book.textSize" aria-label="Bigger text"><span class="ico" aria-hidden="true">Aa</span></button>
          <button id="book-read" class="hud-btn tool-btn" aria-pressed="false" hidden></button>
          <button id="book-voice" class="hud-btn tool-btn" hidden></button>
          <button id="book-close" class="hud-btn tool-btn" data-i18n-aria="listen.close" aria-label="Close"><span class="ico" aria-hidden="true">✕</span><span class="lbl" data-i18n="listen.close">Close</span></button>
        </div>
      </div>
      <div id="book-host"></div>
      <nav class="book-nav">
        <button id="book-prev" class="nav-btn" data-i18n-aria="book.prev" aria-label="Previous page">‹</button>
        <button id="book-next" class="nav-btn" data-i18n-aria="book.next" aria-label="Next page">›</button>
      </nav>
    </section>

    <section id="listen-layer" class="layer listen-layer" hidden></section>
    <section id="reveal-layer" class="layer reveal-layer" hidden></section>
    <section id="panel-layer" class="layer panel-layer" hidden></section>

    <section id="start-layer" class="layer start-layer">
      <div class="start-card">
        <div id="start-daxter" class="start-daxter" aria-hidden="true"></div>
        <img class="start-logo" src="assets/logo.png" alt="Did You Know That? logo" />
        <h1>Did You Know That?</h1>
        <p class="start-sub" data-i18n="start.sub">The Road of Wonders</p>
        <p class="start-copy" data-i18n-html="start.copy"></p>
        <div id="start-pickers" class="start-pickers"></div>
        <button id="start-go" class="btn-gold big">Start the adventure</button>
        <button id="install-app" class="btn-ink install-btn" hidden>📲 Install the app</button>
        <div id="install-ios" class="install-ios" hidden></div>
      </div>
    </section>

    <section id="sheet-layer" class="sheet-layer" hidden></section>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
