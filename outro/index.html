<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Did You Know That? End Screen</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "DYK Heavy";
        src: url("assets/AvenirNext-Heavy.ttf") format("truetype");
      }
      @font-face {
        font-family: "DYK Demi";
        src: url("assets/AvenirNext-DemiBold.ttf") format("truetype");
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #050414;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(ellipse at 50% 45%, #120c3a 0%, #070520 55%, #030210 100%);
      }
      #scene,
      .layer {
        position: absolute;
        inset: 0;
      }
      .nebula {
        position: absolute;
        border-radius: 50%;
        filter: blur(70px);
        opacity: 0;
      }
      #neb-blue {
        left: -300px;
        top: 120px;
        width: 1000px;
        height: 700px;
        background: radial-gradient(circle, rgba(40, 90, 255, 0.7), rgba(40, 90, 255, 0) 70%);
      }
      #neb-violet {
        left: 200px;
        top: 640px;
        width: 1000px;
        height: 560px;
        background: radial-gradient(circle, rgba(150, 40, 255, 0.6), rgba(150, 40, 255, 0) 70%);
      }
      #neb-green {
        right: -260px;
        top: 60px;
        width: 900px;
        height: 640px;
        background: radial-gradient(circle, rgba(40, 220, 90, 0.5), rgba(40, 220, 90, 0) 70%);
      }
      #neb-orange {
        right: 100px;
        top: 640px;
        width: 1000px;
        height: 560px;
        background: radial-gradient(circle, rgba(255, 100, 20, 0.6), rgba(255, 30, 90, 0) 70%);
      }
      .star {
        position: absolute;
        display: block;
        border-radius: 50%;
        background: #fff;
      }

      /* Header */
      #header {
        position: absolute;
        left: 0;
        right: 0;
        top: 72px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 22px;
      }
      #header-logo {
        display: block;
        width: 118px;
        height: 117px;
      }
      #thanks {
        display: block;
        font-family: "DYK Heavy", sans-serif;
        font-size: 92px;
        line-height: 1;
        color: #fff;
        white-space: nowrap;
        text-shadow:
          0 0 18px rgba(255, 255, 255, 0.3),
          0 0 44px rgba(170, 80, 255, 0.7),
          0 5px 0 rgba(90, 30, 160, 0.55);
      }
      .char {
        display: inline-block;
      }

      /* End-screen element placeholders (YouTube overlays its own cards here) */
      .slot {
        position: absolute;
        top: 318px;
        width: 680px;
        height: 383px;
      }
      #slot-left {
        left: 120px;
      }
      #slot-right {
        right: 120px;
      }
      .slot-label {
        position: absolute;
        left: 0;
        right: 0;
        top: -58px;
        display: block;
        text-align: center;
        font-family: "DYK Demi", sans-serif;
        font-size: 32px;
        letter-spacing: 0.16em;
        color: #fff;
      }
      .slot-frame {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 22px;
        padding: 4px;
        background: linear-gradient(135deg, var(--c1), var(--c2));
        box-shadow: 0 0 40px var(--glow);
      }
      .slot-inner {
        width: 100%;
        height: 100%;
        border-radius: 18px;
        background: radial-gradient(ellipse at 50% 40%, rgba(40, 30, 90, 0.92), rgba(8, 6, 26, 0.96));
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .play {
        display: block;
        width: 110px;
        height: 110px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.12);
        border: 3px solid rgba(255, 255, 255, 0.55);
        position: relative;
      }
      .play::after {
        content: "";
        position: absolute;
        left: 42px;
        top: 30px;
        border-style: solid;
        border-width: 22px 0 22px 36px;
        border-color: transparent transparent transparent rgba(255, 255, 255, 0.85);
      }
      #slot-left .slot-frame {
        --c1: #3d7bff;
        --c2: #b040ff;
        --glow: rgba(110, 80, 255, 0.55);
      }
      #slot-right .slot-frame {
        --c1: #ff8a1f;
        --c2: #3ee07a;
        --glow: rgba(255, 150, 60, 0.45);
      }

      /* Subscribe badge in the centre gap */
      #sub {
        position: absolute;
        left: 840px;
        top: 390px;
        width: 240px;
        height: 240px;
      }
      #sub-ring {
        position: absolute;
        inset: -14px;
        border-radius: 50%;
        background: conic-gradient(#3d7bff, #a040ff, #ff3fa4, #ff8a1f, #ffd84a, #3ee07a, #3d7bff);
        filter: blur(1px);
      }
      #sub-disc {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: #0a0820;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #sub-logo {
        display: block;
        width: 190px;
        height: 188px;
      }
      #sub-pill {
        position: absolute;
        left: 50%;
        top: 268px;
        width: 260px;
        margin-left: -130px;
        padding: 14px 0;
        border-radius: 999px;
        text-align: center;
        font-family: "DYK Heavy", sans-serif;
        font-size: 30px;
        letter-spacing: 0.08em;
        color: #fff;
        background: linear-gradient(90deg, #ff2d55, #ff7a1a);
        box-shadow: 0 8px 30px rgba(255, 60, 60, 0.45);
      }

      /* Footer */
      #footer {
        position: absolute;
        left: 0;
        right: 0;
        top: 800px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      #curious {
        display: block;
        font-family: "DYK Heavy", sans-serif;
        font-size: 64px;
        letter-spacing: 0.04em;
        line-height: 1.1;
        white-space: nowrap;
        color: transparent;
        background: linear-gradient(90deg, #3d7bff, #a040ff, #ff3fa4, #ff8a1f, #ffd84a, #3ee07a, #3d7bff);
        background-size: 200% 100%;
        -webkit-background-clip: text;
        background-clip: text;
      }
      #handle {
        display: block;
        font-family: "DYK Demi", sans-serif;
        font-size: 36px;
        letter-spacing: 0.06em;
        color: rgba(255, 255, 255, 0.88);
        white-space: nowrap;
      }
      #blackout {
        position: absolute;
        inset: 0;
        background: #000;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="15"
      data-width="1920"
      data-height="1080"
    >
      <div id="scene" class="clip" data-start="0" data-duration="15" data-track-index="0">
        <div class="layer">
          <div id="neb-blue" class="nebula"></div>
          <div id="neb-violet" class="nebula"></div>
          <div id="neb-green" class="nebula"></div>
          <div id="neb-orange" class="nebula"></div>
        </div>
        <div id="stars" class="layer"></div>

        <div id="header">
          <img id="header-logo" src="assets/logo.png" alt="" />
          <div id="thanks" data-split>THANKS FOR WATCHING!</div>
        </div>

        <div id="slot-left" class="slot">
          <span class="slot-label">WATCH NEXT</span>
          <div class="slot-frame"><div class="slot-inner"><span class="play"></span></div></div>
        </div>
        <div id="slot-right" class="slot">
          <span class="slot-label">MORE AMAZING FACTS</span>
          <div class="slot-frame"><div class="slot-inner"><span class="play"></span></div></div>
        </div>

        <div id="sub">
          <div id="sub-ring"></div>
          <div id="sub-disc"><img id="sub-logo" src="assets/logo.png" alt="" /></div>
          <div id="sub-pill">SUBSCRIBE</div>
        </div>

        <div id="footer">
          <span id="curious">STAY CURIOUS!</span>
          <span id="handle">@Did-You-Know-that-2026</span>
        </div>

        <div id="blackout"></div>
      </div>
      <audio
        id="outro-audio"
        src="assets/outro.wav"
        data-start="0"
        data-duration="15"
        data-track-index="10"
        data-volume="1"
      ></audio>
    </div>
    <script>
      function mulberry32(seed) {
        return function () {
          seed |= 0;
          seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const rand = mulberry32(7);
      const DURATION = 15;
      const STAR_COUNT = 120;

      function splitChars(el) {
        const text = el.textContent;
        el.textContent = "";
        [...text].forEach((ch) => {
          const span = document.createElement("span");
          span.className = "char";
          span.textContent = ch === " " ? " " : ch;
          el.appendChild(span);
        });
      }

      function makeStars(container) {
        return Array.from({ length: STAR_COUNT }, () => {
          const star = document.createElement("span");
          const size = 1 + rand() * 3;
          star.className = "star";
          star.style.width = `${size}px`;
          star.style.height = `${size}px`;
          star.style.left = `${rand() * 1920}px`;
          star.style.top = `${rand() * 1080}px`;
          star.style.opacity = "0";
          container.appendChild(star);
          return { el: star, peak: 0.25 + rand() * 0.6, phase: rand() };
        });
      }

      function build() {
        document.querySelectorAll("[data-split]").forEach(splitChars);
        const stars = makeStars(document.getElementById("stars"));
        const tl = gsap.timeline({ paused: true });

        // Ambient background for the whole 15 s
        tl.to(".nebula", { opacity: 1, duration: 1.2, ease: "sine.out", stagger: 0.1 }, 0);
        tl.fromTo("#neb-blue", { x: -60, scale: 1 }, { x: 60, scale: 1.1, duration: DURATION, ease: "none" }, 0);
        tl.fromTo("#neb-orange", { x: 60 }, { x: -60, duration: DURATION, ease: "none" }, 0);
        tl.fromTo("#neb-green", { y: -30 }, { y: 30, duration: DURATION, ease: "none" }, 0);
        tl.fromTo("#neb-violet", { scale: 1.1 }, { scale: 0.9, duration: DURATION, ease: "none" }, 0);
        stars.forEach(({ el, peak, phase }) => {
          tl.to(el, { opacity: peak, duration: 0.8 }, phase * 0.8);
          tl.to(el, { opacity: peak * 0.2, duration: 0.9 + phase, ease: "sine.inOut", yoyo: true, repeat: 9 }, 1 + phase * 2);
        });

        // 0.0 – 1.8  build in
        tl.fromTo("#header-logo", { scale: 0, rotation: -40 }, { scale: 1, rotation: 0, duration: 0.6, ease: "back.out(2)" }, 0.45);
        tl.fromTo(
          "#thanks .char",
          { y: 80, opacity: 0, scale: 1.6, filter: "blur(10px)" },
          { y: 0, opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.4, ease: "back.out(1.8)", stagger: 0.025 },
          0.55,
        );
        tl.fromTo("#slot-left", { x: -260, opacity: 0 }, { x: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 0.9);
        tl.fromTo("#slot-right", { x: 260, opacity: 0 }, { x: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 0.9);
        tl.fromTo("#sub", { scale: 0, rotation: 90 }, { scale: 1, rotation: 0, duration: 0.7, ease: "back.out(1.7)" }, 1.15);
        tl.fromTo("#curious", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 1.45);
        tl.fromTo("#handle", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 1.6);

        // 1.8 – 14  gentle life while viewers choose
        tl.to("#sub-ring", { rotation: 360 * 3, duration: DURATION, ease: "none" }, 0);
        tl.to("#sub-pill", { scale: 1.08, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 11 }, 2.2);
        tl.to("#sub-logo", { y: -8, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 9 }, 2);
        tl.to("#header-logo", { rotation: 8, duration: 1, ease: "sine.inOut", yoyo: true, repeat: 11 }, 1.8);
        tl.to(".slot-frame", { opacity: 0.75, duration: 1.5, ease: "sine.inOut", yoyo: true, repeat: 7, stagger: 0.75 }, 2);
        tl.fromTo("#curious", { backgroundPosition: "0% 0" }, { backgroundPosition: "200% 0", duration: 12, ease: "none", immediateRender: false }, 1.5);

        // 14.2 – 15  fade out
        tl.to("#blackout", { opacity: 1, duration: 0.8, ease: "power1.in" }, 14.2);

        window.__timelines["main"] = tl;
        tl.seek(0);
      }

      document.fonts.ready.then(build);
    </script>
  </body>
</html>
