<!doctype html>
<html
  lang="en"
  data-resolution="landscape"
  data-composition-variables='[
    {"id":"word","type":"string","label":"Special word","default":"SPARK"},
    {"id":"kicker","type":"string","label":"Kicker","default":"SECRET POWER-UP WORD"},
    {"id":"footer","type":"string","label":"Footer","default":"Type it in the game to unlock the magic book ✦"},
    {"id":"theme","type":"enum","label":"Audience","default":"kids","options":[{"value":"kids","label":"Kids"},{"value":"adults","label":"Adults"}]}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Neon Card</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "DYK Heavy";
        src: url("assets/AvenirNext-Heavy.ttf") format("truetype");
      }
      @font-face {
        font-family: "DYK Demi";
        src: url("assets/AvenirNext-DemiBold.ttf") format("truetype");
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #030210;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(ellipse at 50% 50%, #140b3e 0%, #050318 60%, #020108 100%);
      }
      #scene {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        perspective: 1600px;
      }
      .haze {
        position: absolute;
        width: 900px;
        height: 900px;
        border-radius: 50%;
        filter: blur(90px);
        opacity: 0;
      }
      #haze-a {
        left: 180px;
        top: 120px;
        background: radial-gradient(circle, rgba(61, 123, 255, 0.55), transparent 70%);
      }
      #haze-b {
        right: 180px;
        top: 80px;
        background: radial-gradient(circle, rgba(255, 63, 164, 0.5), transparent 70%);
      }
      .star {
        position: absolute;
        display: block;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: #fff;
        opacity: 0;
      }
      #card-wrap {
        position: relative;
        display: block;
        width: 680px;
        height: 860px;
      }
      #ring {
        position: absolute;
        inset: -10px;
        border-radius: 52px;
        background: conic-gradient(from var(--spin, 0deg), #3d7bff, #a040ff, #ff3fa4, #ff8a1f, #ffd84a, #3ee07a, #3d7bff);
        filter: blur(2px);
        opacity: 0;
      }
      #ring-glow {
        position: absolute;
        inset: -40px;
        border-radius: 80px;
        background: conic-gradient(from var(--spin, 0deg), #3d7bff, #a040ff, #ff3fa4, #ff8a1f, #ffd84a, #3ee07a, #3d7bff);
        filter: blur(48px);
        opacity: 0;
      }
      #card {
        position: absolute;
        inset: 0;
        border-radius: 44px;
        background: radial-gradient(ellipse at 50% 30%, #241468 0%, #0c0630 70%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        padding: 70px 50px 64px;
        box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.12);
      }
      #logo {
        display: block;
        width: 210px;
        height: 208px;
      }
      #kicker {
        display: block;
        font-family: "DYK Demi", sans-serif;
        font-size: 30px;
        letter-spacing: 0.24em;
        color: #ffd84a;
        text-align: center;
      }
      #word {
        display: block;
        font-family: "DYK Heavy", sans-serif;
        font-size: 150px;
        line-height: 1;
        letter-spacing: 0.04em;
        color: #fff;
        white-space: nowrap;
        text-shadow:
          0 0 10px #fff,
          0 0 30px #ff3fa4,
          0 0 60px #a040ff,
          0 0 110px #3d7bff;
      }
      .ch {
        display: inline-block;
      }
      #footer {
        display: block;
        font-family: "DYK Demi", sans-serif;
        font-size: 26px;
        color: rgba(255, 255, 255, 0.8);
        text-align: center;
      }
      #flash {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0) 60%);
        opacity: 0;
      }
      [data-theme="adults"] #ring,
      [data-theme="adults"] #ring-glow {
        background: conic-gradient(from var(--spin, 0deg), #ffd84a, #ff8a1f, #fff1b0, #b97a0a, #ffd84a);
      }
      [data-theme="adults"] #word {
        text-shadow:
          0 0 10px #fff,
          0 0 30px #ffd84a,
          0 0 70px #ff8a1f,
          0 0 120px #b97a0a;
      }
      [data-theme="adults"] #kicker {
        color: #fff1b0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1920" data-height="1080">
      <div id="scene" class="clip" data-start="0" data-duration="8" data-track-index="0">
        <div id="haze-a" class="haze"></div>
        <div id="haze-b" class="haze"></div>
        <div id="stars"></div>
        <div id="card-wrap">
          <div id="ring-glow"></div>
          <div id="ring"></div>
          <div id="card">
            <img id="logo" src="assets/logo.png" alt="" />
            <span id="kicker" data-var-text="kicker">SECRET POWER-UP WORD</span>
            <span id="word">SPARK</span>
            <span id="footer" data-var-text="footer">Type it in the game to unlock the magic book ✦</span>
          </div>
        </div>
        <div id="flash"></div>
      </div>
    </div>
    <script>
      function mulberry32(seed) {
        return function () {
          seed |= 0;
          seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const rand = mulberry32(11);
      const STAR_COUNT = 90;

      function build() {
        const vars = window.__hyperframes?.getVariables?.() ?? {};
        const word = String(vars.word ?? "SPARK").toUpperCase();
        document.getElementById("root").dataset.theme = vars.theme ?? "kids";
        const wordEl = document.getElementById("word");
        wordEl.textContent = "";
        [...word].forEach((c) => {
          const span = document.createElement("span");
          span.className = "ch";
          span.textContent = c;
          wordEl.appendChild(span);
        });
        // Long words shrink to keep inside the card.
        const fit = Math.min(1, 560 / wordEl.scrollWidth);
        wordEl.style.fontSize = `${Math.floor(150 * fit)}px`;

        const starsEl = document.getElementById("stars");
        const stars = Array.from({ length: STAR_COUNT }, () => {
          const s = document.createElement("span");
          s.className = "star";
          s.style.left = `${rand() * 1920}px`;
          s.style.top = `${rand() * 1080}px`;
          starsEl.appendChild(s);
          return { el: s, peak: 0.3 + rand() * 0.7, at: rand() };
        });

        const tl = gsap.timeline({ paused: true });
        tl.to(".haze", { opacity: 1, duration: 1.2, stagger: 0.2 }, 0);
        stars.forEach(({ el, peak, at }) => {
          tl.to(el, { opacity: peak, duration: 0.5 }, at);
          tl.to(el, { opacity: peak * 0.2, duration: 0.7, yoyo: true, repeat: 6, ease: "sine.inOut" }, 1 + at);
        });

        // 0.0 – 0.9 card spins in
        tl.fromTo("#card-wrap", { rotationY: -100, scale: 0.4, opacity: 0 }, { rotationY: 0, scale: 1, opacity: 1, duration: 0.9, ease: "back.out(1.4)" }, 0.1);
        // 0.7 – 1.3 neon border buzzes on
        tl.fromTo("#ring", { opacity: 0 }, { opacity: 1, duration: 0.06, yoyo: true, repeat: 5, ease: "none" }, 0.7);
        tl.to("#ring", { opacity: 1, duration: 0.1 }, 1.1);
        tl.to("#ring-glow", { opacity: 0.85, duration: 0.5 }, 1.1);
        tl.fromTo(["#ring", "#ring-glow"], { "--spin": "0deg" }, { "--spin": "360deg", duration: 7, ease: "none" }, 1);
        // 1.2 kicker, 1.5 – 2.4 word lights up letter by letter
        tl.fromTo("#kicker", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4 }, 1.2);
        tl.fromTo("#word .ch", { opacity: 0, scale: 2.2, filter: "blur(12px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.35, ease: "back.out(2)", stagger: 0.12 }, 1.5);
        tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.5, duration: 0.1, yoyo: true, repeat: 1 }, 2.3);
        tl.fromTo("#footer", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 2.6);
        // 2.6 – 7.2 breathe
        tl.to("#word", { scale: 1.06, duration: 0.9, yoyo: true, repeat: 4, ease: "sine.inOut" }, 2.6);
        tl.to("#card-wrap", { y: -10, duration: 1.2, yoyo: true, repeat: 3, ease: "sine.inOut" }, 2.6);
        // 7.3 – 8 out
        tl.to("#card-wrap", { scale: 0.85, opacity: 0, duration: 0.6, ease: "power2.in" }, 7.35);
        tl.to(".haze", { opacity: 0, duration: 0.6 }, 7.35);

        window.__timelines["main"] = tl;
        tl.seek(0);
      }
      document.fonts.ready.then(build);
    </script>
  </body>
</html>
