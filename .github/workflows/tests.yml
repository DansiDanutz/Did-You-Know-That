name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check every module
        run: find js tools sw.js \( -name "*.js" -o -name "*.mjs" \) | xargs -n1 node --check
      - name: Generated pages match data/episodes.json
        run: node tools/build-site.mjs --check
      - name: Unit tests
        run: node --test tests/*.test.mjs
